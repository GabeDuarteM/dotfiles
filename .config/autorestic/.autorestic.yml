backends:
  nas:
    type: sftp
    path: nas:/mnt/user/backups/restic/gabearch
    env: {}
    rest:
      user: ""
      password: ""
    options: {}
locations:
  home:
    from:
      - ~/
    type: ""
    to:
      - nas
    forget: "yes"
    hooks:
      dir: ""
      prevalidate: []
      before: []
      after: []
      success: []
      failure: []
    cron: "0 * * * *"
    options:
      backup:
        exclude:
          - "*.gguf"
          - "*.safetensors"
          - "*.ckpt"
          - "**/node_modules"
          - "**/site-packages"
          - Games/Steam/steamapps
          - Games/Epic Games
          - Games/osu
          - Downloads
          - .cache/paru/clone
          - .local/share/pnpm/store
          - ai-models
          - projects/**/target/release
          - projects/**/.next
          - work/**/.next
          - .cache
          - .chroot
          - .local/share/containers/storage
          - projects/odysseus/data/.app_key
          - projects/odysseus/data/uploads/uploads.json
      forget:
        keep-hourly: 24
        keep-daily: 7
        keep-weekly: 4
        keep-monthly: 2
version: 2
